services:
  # Spring Boot REST API
  - type: web
    name: hotel-bed-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        fromDatabase:
          name: hotel-postgres-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: hotel-postgres-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hotel-postgres-db
          property: password
      - key: MAIL_USERNAME
        value: msdkalaikalai@gmail.com
      - key: MAIL_PASSWORD
        sync: false

  # React + Vite Static Frontend
  - type: web
    name: hotel-bed-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hotel-bed-backend
          property: host

databases:
  # Managed Cloud PostgreSQL Database
  - name: hotel-postgres-db
    databaseName: hotel
    user: postgres
    plan: free
    region: oregon
